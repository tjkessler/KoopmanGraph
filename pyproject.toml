[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koopman-graph"
dynamic = ["version"]
description = "Topology-aware Koopman autoencoders for forecasting and analyzing networked dynamics"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Travis Kessler", email = "travis.j.kessler@gmail.com" },
]
keywords = [
    "koopman",
    "graph-neural-networks",
    "pytorch-geometric",
    "spatiotemporal",
    "topological",
    "dynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.8.0",
    "torch-geometric>=2.6.1",
    "safetensors>=0.4",
]

[project.optional-dependencies]
cli = [
    "pyyaml>=6",
]
explain = [
    "captum>=0.7",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.15.0",
    "pre-commit>=4.0.0",
    "nbmake>=0.5.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "ipykernel>=6.29.0",
    "pandas>=2.0.0",
    "gymnasium>=1.0.0",
    "h5py>=3.10.0",
]
docs = [
    "sphinx>=8.0.0",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
]
rl = [
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.3.0",
]
symmetry = [
    "networkx>=3.0",
]
mpc = [
    "osqp>=0.6.0",
    "scipy>=1.11.0",
]
# Optional distributed-training adapters (0.8.0). Native DDP uses torch only;
# these extras gate Lightning Fabric / Trainer, Ray jobs / Ray Train, and
# optional Dask prep. ``[ray]`` pins ``ray[train]`` for the Train backend.
# Exclude Lightning 2.6.2 / 2.6.3 (compromised releases on PyPI).
lightning = [
    "lightning>=2.4.0,!=2.6.2,!=2.6.3",
]
ray = [
    "ray[train]>=2.9.0",
]
dask = [
    "dask[distributed]>=2024.1.0",
]
# Optional MD trajectory I/O for the GraphVAMP / molecular toolchain (mdtraj MVP).
md = [
    "mdtraj>=1.9.9",
]
# Optional MSM / VAMP toolchain (deeptime). Covers VAMP-2 oracle tests and the
# GraphVAMP / implied-timescale helpers — not a PyEMMA replacement.
msm = [
    "deeptime>=0.4",
]
# Optional torchdiffeq for the STGODE teaching traffic baseline.
baselines-ode = [
    "torchdiffeq>=0.2.3",
]
# Reserved for future mesh/weather helper deps. GraphCastBaseline teaching
# path is pure PyTorch (no JAX / DeepMind graphcast / eccodes); extra is a no-op.
baselines-graphcast = []
# Optional e3nn for Tier-B steerable SE(3) encode (not equivariant K).
equivariance = [
    "e3nn>=0.5.1",
]
distributed = [
    "lightning>=2.4.0,!=2.6.2,!=2.6.3",
    "ray[train]>=2.9.0",
    "dask[distributed]>=2024.1.0",
]

[project.scripts]
koopman-graph = "koopman_graph.cli:main"

[project.urls]
Homepage = "https://github.com/tjkessler/KoopmanGraph"
Documentation = "https://koopmangraph.readthedocs.io/"
Repository = "https://github.com/tjkessler/KoopmanGraph"
Issues = "https://github.com/tjkessler/KoopmanGraph/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"koopman_graph.datasets.molecular" = ["data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "koopman_graph.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore::tqdm.std.TqdmWarning",
]
markers = [
    "distributed: multi-process gloo/DDP smoke (opt-in via KOOPMAN_GRAPH_DISTRIBUTED_TESTS=1)",
    "ray: starts a local Ray / Ray Train runtime (exclude on macOS smoke)",
    "slow: long-running CPU tests reserved for full Ubuntu matrix (exclude on macOS smoke)",
]

[tool.coverage.run]
source = ["koopman_graph"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# uv defaults to official CPU wheels (matches CI). For CUDA / ROCm / XPU, use
# `uv pip install torch --torch-backend=auto` (or a specific backend) and see
# https://docs.astral.sh/uv/guides/integration/pytorch/ — or override sources.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
