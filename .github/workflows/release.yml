name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: >
          uv sync --frozen
          --extra dev --extra rl --extra mpc --extra symmetry --extra docs
          --extra distributed --extra equivariance
          --extra baselines-ode --extra msm

      - name: Lint with Ruff
        run: |
          uvx ruff check src/ tests/
          uvx ruff format --check src/ tests/

      - name: Run tests with coverage
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          TORCH_NUM_THREADS: "1"
        run: >
          uv run --no-sync pytest tests/ -n auto
          --cov=koopman_graph
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Build Sphinx documentation
        run: >
          uv run --no-sync sphinx-build -b html -W --keep-going
          docs/source docs/build/html

  pypi-publish:
    name: pypi-publish
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distributions
        run: |
          uv sync --frozen --extra dev
          uv run --no-sync python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
